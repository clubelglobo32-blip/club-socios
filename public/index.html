<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Club Manager Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); background: white; }
        #login-logo { max-height: 80px; object-fit: contain; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <img id="login-logo" src="" alt="Logo" style="display:none;">
        </div>
        <h3 class="text-center fw-bold mb-4 text-primary" id="lbl-club-title-login">Club Manager Pro</h3>
        <div id="error-msg" class="alert alert-danger d-none py-2 small" role="alert"></div>
        <form id="form-login">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Usuario</label>
                <input type="text" class="form-control" id="usuario" required autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">Contraseña</label>
                <input type="password" class="form-control" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Ingresar</button>
        </form>
    </div>

    <script>
        fetch('/api/ajustes').then(res => res.json()).then(data => {
            if (data.nombre_club) document.getElementById('lbl-club-title-login').textContent = data.nombre_club;
            if (data.logo_url) {
                const el = document.getElementById('login-logo');
                el.src = data.logo_url;
                el.style.display = 'inline-block';
            }
        }).catch(() => {});

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });

            const data = await res.json();
            if (data.success) {
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.textContent = data.message || 'Usuario o contraseña incorrectos';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
